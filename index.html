<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2009064449772983&ev=Purchase&noscript=1"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BD Dating - FREE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif;
      background: #06060e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 360px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      font-size: 40px;
      color: #ffffff;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 18px;
      color: #888;
      margin-bottom: 48px;
    }
    
    .lang-selector {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .lang-btn {
      width: 100%;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .lang-btn:active {
      transform: translateY(0);
    }
    
    .lang-btn.primary {
      background: #d34127;
      border-color: #d34127;
      box-shadow: 0 8px 24px rgba(211, 65, 39, 0.4);
    }
    
    .lang-btn.primary:hover {
      background: #e84d2f;
      border-color: #e84d2f;
      transform: translateY(-2px);
    }
    
    .lang-flag {
      font-size: 28px;
      margin-right: 12px;
      vertical-align: middle;
    }
    
    .loading {
      display: none;
      margin-top: 24px;
      color: #666;
      font-size: 14px;
    }
    
    .loading.show {
      display: block;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #666;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ভাষা নির্বাচন করুন</h1>
    <p class="subtitle">Select Your Language</p>
    
    <div class="lang-selector">
    <button class="lang-btn" onclick="selectLanguage('bn')">
      <span class="flag">🇧🇩</span>
      <span class="lang-name">বাংলা</span>
      <span class="check-icon">✓</span>
    </button>
    
    <button class="lang-btn" onclick="selectLanguage('en')">
      <span class="flag">🇬🇧</span>
      <span class="lang-name">English</span>
      <span class="check-icon">✓</span>
    </button>
    </div>
  </div>
    
    <div class="loading" id="loadingMsg">
      <span class="spinner"></span>
      Loading...
    </div>
  </div>

  <!-- Facebook Pixel Code -->
  <script>
    // ========================================
    // 📱 配置区域 - 只需修改这里！
    // ========================================
    var PIXEL_IDS = [
      //'2585386425266588',  // 主像素ID
      //'2009064449772983',  // 备用像素ID（取消注释即可启用）
      //'1084556820735368',  // 第三个像素ID（取消注释即可启用）
    ];
    var FINAL_URL = 'https://fizzio.tv/';  // 跳转地址
    // ========================================

    // Facebook Pixel 基础代码
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // 初始化所有像素ID
    for (var i = 0; i < PIXEL_IDS.length; i++) {
      fbq('init', PIXEL_IDS[i]);
      console.log('Pixel initialized: ' + PIXEL_IDS[i]);
    }
    
    // 触发 PageView 事件到所有像素
    fbq('track', 'PageView');
  </script>
  
  <!-- NoScript 部分（所有像素ID） -->

  <!-- End Facebook Pixel Code -->
  <!-- 注意：如果添加或删除像素ID，需要同步更新上面的 noscript 标签 -->

  <script>
    // ============================================================
    // 📱 Facebook CAPI 配置
    // ============================================================
    // 不再需要在前端配置 Pixel ID，所有配置在 Vercel 环境变量中
    
    // 最终跳转 URL - 修改这里设置跳转地址
    var FINAL_URL = 'https://fizzio.tv/';
    
    // ============================================================
    // Facebook CAPI 客户端辅助代码
    // ============================================================
    
    // 获取或生成 _fbp cookie（Facebook Browser Pixel）
    function getFbp() {
      var match = document.cookie.match('(^|;)\\s*_fbp\\s*=\\s*([^;]+)');
      if (match) return match[2];
      
      // 生成新的 _fbp
      var fbp = 'fb.1.' + Date.now() + '.' + Math.random().toString(36).substr(2, 9);
      document.cookie = '_fbp=' + fbp + '; path=/; max-age=7776000'; // 90天
      return fbp;
    }
    
    // 获取 _fbc cookie（Facebook Click ID）
    function getFbc() {
      var match = document.cookie.match('(^|;)\\s*_fbc\\s*=\\s*([^;]+)');
      if (match) return match[2];
      
      // 尝试从 URL 参数获取 fbclid
      var urlParams = new URLSearchParams(window.location.search);
      var fbclid = urlParams.get('fbclid');
      if (fbclid) {
        var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
        document.cookie = '_fbc=' + fbc + '; path=/; max-age=7776000'; // 90天
        return fbc;
      }
      
      return null;
    }
    
    // 随机事件ID生成器（用于去重）
    function generateEventId() {
      return 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }
    
    // 发送事件到 CAPI
    async function sendCAPIEvent(eventName, customData = {}) {
      try {
        var eventId = generateEventId();
        
        var payload = {
          event_name: eventName,
          event_id: eventId,
          custom_data: customData,
          fbp: getFbp(),
          fbc: getFbc(),
          user_agent: navigator.userAgent,
          page_url: window.location.href,
          referrer_url: document.referrer
        };
        
        var response = await fetch('/api/fb-capi', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });
        
        var result = await response.json();
        
        if (result.success) {
          console.log('✅ CAPI Event sent: ' + eventName + ' | EventID: ' + eventId + ' | Pixels: ' + result.pixels.successful + '/' + result.pixels.total);
          return { success: true, eventId: eventId };
        } else {
          console.error('❌ CAPI Event failed:', result.error);
          return { success: false, error: result.error };
        }
      } catch (error) {
        console.error('❌ CAPI Request error:', error);
        return { success: false, error: error.message };
      }
    }
    
    // 页面加载时发送 PageView
    window.addEventListener('load', function() {
      sendCAPIEvent('PageView');
    });
    
    // 语言选择处理函数
    function selectLanguage(lang) {
      console.log('Language selected: ' + lang);
      
      // 发送 Purchase 事件（已取消去重逻辑，用于测试）
      sendCAPIEvent('Purchase', {
        content_name: 'BD Dating App Language Selected',
        content_type: 'product',
        content_category: 'app_activation',
        language: lang
      });
      
      // 延迟跳转，确保事件发送成功
      setTimeout(function() {
        // 跳转到最终页面（带语言参数）
        var finalUrl = FINAL_URL;
        if (finalUrl.indexOf('?') > -1) {
          finalUrl += '&lang=' + lang;
        } else {
          finalUrl += '?lang=' + lang;
        }
        window.location.href = finalUrl;
      }, 1500);
    }
  </script>
</body>
</html>
