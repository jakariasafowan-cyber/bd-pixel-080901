<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BD Dating - FREE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif;
      background: #06060e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 360px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      font-size: 40px;
      color: #ffffff;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-size: 18px;
      color: #888;
      margin-bottom: 48px;
    }
    
    .lang-selector {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .lang-btn {
      width: 100%;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .lang-btn:active {
      transform: translateY(0);
    }
    
    .lang-btn.primary {
      background: #d34127;
      border-color: #d34127;
      box-shadow: 0 8px 24px rgba(211, 65, 39, 0.4);
    }
    
    .lang-btn.primary:hover {
      background: #e84d2f;
      border-color: #e84d2f;
      transform: translateY(-2px);
    }
    
    .lang-flag {
      font-size: 28px;
      margin-right: 12px;
      vertical-align: middle;
    }
    
    .loading {
      display: none;
      margin-top: 24px;
      color: #666;
      font-size: 14px;
    }
    
    .loading.show {
      display: block;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #666;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ভাষা নির্বাচন করুন</h1>
    <p class="subtitle">Select Your Language</p>
    
    <div class="lang-selector">
    <button class="lang-btn" onclick="selectLanguage('bn')">
      <span class="flag">🇧🇩</span>
      <span class="lang-name">বাংলা</span>
      <span class="check-icon">✓</span>
    </button>
    
    <button class="lang-btn" onclick="selectLanguage('en')">
      <span class="flag">🇬🇧</span>
      <span class="lang-name">English</span>
      <span class="check-icon">✓</span>
    </button>
    </div>
  </div>
    
    <div class="loading" id="loadingMsg">
      <span class="spinner"></span>
      Loading...
    </div>
  </div>

  <!-- Facebook Pixel Code -->
  <script>
    // ========================================
    // 📱 配置区域 - 只需修改这里！
    // ========================================
    var PIXEL_IDS = [
      '2585386425266588',  // 主像素ID
      '2009064449772983',  // 备用像素ID（取消注释即可启用）
      '916776361499360',  // 第三个像素ID（取消注释即可启用）
    ];
    var FINAL_URL = 'https://fizzio.tv/';  // 跳转地址
    // ========================================

    // Facebook Pixel 基础代码
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // 初始化所有像素ID
    for (var i = 0; i < PIXEL_IDS.length; i++) {
      fbq('init', PIXEL_IDS[i]);
      console.log('Pixel initialized: ' + PIXEL_IDS[i]);
    }
    
    // 触发 PageView 事件到所有像素
    fbq('track', 'PageView');
  </script>
  
  <!-- NoScript 部分（所有像素ID） -->
  <noscript>
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2585386425266588&ev=PageView&noscript=1" />
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2009064449772983&ev=PageView&noscript=1" />
  <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=916776361499360&ev=PageView&noscript=1" />
  </noscript>
  <!-- End Facebook Pixel Code -->
  <!-- 注意：如果添加或删除像素ID，需要同步更新上面的 noscript 标签 -->

  <script>
    // ========================================
    // 去重配置
    // ========================================
    var DEDUP_TIME_WINDOW = 24 * 60 * 60 * 1000; // 24小时内去重（毫秒）
    
    // 生成唯一的事件ID（基于用户标识和时间戳）
    function generateEventId() {
      // 获取或创建用户唯一标识
      var userId = localStorage.getItem('fb_user_id');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        localStorage.setItem('fb_user_id', userId);
      }
      
      // 生成事件ID：用户ID + 日期（确保同一用户同一天的事件ID相同）
      var today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
      return userId + '_' + today;
    }
    
    // 检查是否已经触发过转换事件
    function hasTrackedRecently() {
      try {
        var lastTracked = localStorage.getItem('purchase_tracked');
        var lastTime = localStorage.getItem('purchase_time');
        
        if (!lastTracked || !lastTime) {
          return false;
        }
        
        // 检查时间窗口
        var timeDiff = Date.now() - new Date(lastTime).getTime();
        if (timeDiff < DEDUP_TIME_WINDOW) {
          console.log('⚠️ Purchase event已在 ' + Math.round(timeDiff / 1000 / 60) + ' 分钟前触发，跳过重复发送');
          return true;
        }
        
        return false;
      } catch(e) {
        console.error('Error checking tracked status:', e);
        return false;
      }
    }
    
    // 语言选择处理函数
    function selectLanguage(lang) {
      var loadingMsg = document.getElementById('loadingMsg');
      
      // 显示加载提示
      if (loadingMsg) {
        loadingMsg.className = 'loading show';
      }
      
      try {
        // 保存选择的语言
        localStorage.setItem('selected_language', lang);
        
        // ✅ 去重检查：如果最近已经触发过，则跳过
        if (hasTrackedRecently()) {
          console.log('✅ 检测到重复点击，跳过 Facebook 事件发送');
        } else {
          // 生成唯一事件ID（Facebook官方推荐的去重方式）
          var eventId = generateEventId();
          
          // 触发购物事件到所有像素，带事件ID去重
          fbq('track', 'Purchase', {
            content_name: 'BD Dating App Language Selected',
            content_type: 'product',
            content_category: 'app_activation'
          }, {
            eventID: eventId  // Facebook 官方去重参数
          });
          
          // 保存购物事件触发记录
          localStorage.setItem('purchase_tracked', 'true');
          localStorage.setItem('purchase_time', new Date().toISOString());
          localStorage.setItem('last_event_id', eventId);
          
          console.log('✅ Purchase event tracked. EventID=' + eventId + ', Language=' + lang);
        }
      } catch(e) {
        console.error('Error tracking purchase:', e);
      }
      
      // 延迟跳转，确保像素事件发送成功
      setTimeout(function() {
        // 跳转到最终页面（带语言参数）
        var finalUrl = FINAL_URL;
        if (finalUrl.indexOf('?') > -1) {
          finalUrl += '&lang=' + lang;
        } else {
          finalUrl += '?lang=' + lang;
        }
        window.location.href = finalUrl;
      }, 1500);
    }
  </script>
</body>
</html>
